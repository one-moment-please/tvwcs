# TVWCS — i3 / sway configuration fragment
# Location: ~/.local/share/tvwcs/tvwcs.conf
#
# install.sh offers to add this ONE line to ~/.config/i3/config and/or ~/.config/sway/config
# (i3 4.20 or newer, and every sway, support `include`):
#
#     include ~/.local/share/tvwcs/tvwcs.conf
#
# On older i3 versions, paste the contents of this file into ~/.config/i3/config instead.
# install.sh points the exec path below at wherever it installed TVWCS.
# Reload afterwards with Mod+Shift+R (i3) or Mod+Shift+C (sway).

# --- Start the controller (it runs hidden until summoned) --------------------------------
exec --no-startup-id ~/.local/share/tvwcs/bin/tvwcs

# --- Hotkeys -----------------------------------------------------------------------------
# The keys that show TVWCS are chosen in TVWCS itself (Applications > Settings > Hotkeys). TVWCS writes
# them to this file, which install.sh creates with the defaults (keyboard: tap Super = Quick Menu;
# remote: F2 = Quick Menu; gamepad: none) and TVWCS keeps up to date, along with the remote's fullscreen
# key and any hotkeys given to application profiles. Do not edit it by hand.
include ~/.config/tvwcs/hotkeys.conf

# --- Window setup and positioning --------------------------------------------------------
# TVWCS is a borderless floating panel. i3 does not know each monitor's usable area (screen
# minus bar), so TVWCS asks i3 for it every time it opens and then places the window:
#   - Quick Menu: at the left of the active workspace, full height
#   - Applications: the same window widened to the right (the guide, or Settings)
# with the same margin on the top, bottom, left and right. The margin and Quick Menu width are
# settings in ~/.config/tvwcs/config.json ("settings": {"margin": 20, "quick_width": 460}),
# and the interface size (Desktop / TV Mode / 4K TV Mode) is chosen in Settings.
# The rules below make sure the window starts out floating and borderless; they also act as a
# fallback if the placement command ever arrives late.
for_window [title="^TVWCS$"] floating enable, border pixel 0

# TVWCS dialogs (profile editor, application profiles) are ordinary centered floating windows.
# Their titles start with "TVWCS · " so a document named "tvwcs ..." in some other app is never caught by this rule.
for_window [title="^TVWCS · .+"] floating enable, border pixel 2, move position center
