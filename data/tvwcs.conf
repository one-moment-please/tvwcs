# TVWCS — sway configuration fragment, part of the tvwcs package: /usr/share/tvwcs/tvwcs.conf
#
# TVWCS's own session ("TVWCS" at the login screen) includes it, and runs TVWCS in TV mode. To have TVWCS in your
# usual sway session too (desktop mode), add this one line to ~/.config/sway/config (install.sh offers to):
#
#     include /usr/share/tvwcs/tvwcs.conf
#
# Reload sway afterwards with Mod+Shift+C.

# --- The session's display, for services D-Bus and systemd start ------------------------
# Without it the desktop portal cannot find the display, apps wait for it before their window appears, and
# notifications fail.
exec sh -c 'export XDG_CURRENT_DESKTOP="${XDG_CURRENT_DESKTOP:-sway}"; command -v dbus-update-activation-environment >/dev/null && dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP'

# --- Start the controller (it runs hidden until summoned) --------------------------------
exec /usr/bin/tvwcs

# --- Mouse pointer ----------------------------------------------------------------------
# TVWCS has sway hide it after a few seconds without moving (Settings > Appearance > Hide the mouse pointer).
# On in TV mode, off at a desk.

# --- Hotkeys -----------------------------------------------------------------------------
# The keys that show TVWCS are chosen in the Settings app (Settings > Remote and hotkeys). TVWCS writes
# them to this file (the session creates it with the defaults: keyboard: tap Super = Quick Menu; remote:
# F2 = Quick Menu) and keeps it up to date, along with the remote's fullscreen key and any hotkeys given
# to applications. Do not edit it by hand.
include ~/.config/tvwcs/hotkeys.conf

# --- Window setup and positioning --------------------------------------------------------
# TVWCS is a borderless floating panel. TVWCS asks sway for each display's usable area (screen minus bar)
# every time it opens and then places the window:
#   - Quick Menu: at the left of the active workspace, full height
#   - Applications: the same window widened to the right (the guide, or Settings)
# with the same margin on the top, bottom, left and right. The margin and Quick Menu width are
# settings in ~/.config/tvwcs/config.json ("settings": {"margin": 20, "quick_width": 460}),
# and the interface size (Desktop / TV Mode / 4K TV Mode) is chosen in Settings.
# The rules below make sure the window starts out floating and borderless; they also act as a
# fallback if the placement command ever arrives late.
for_window [title="^TVWCS$"] floating enable, border pixel 0

# TVWCS dialogs (profile editor, application profiles) are ordinary centered floating windows.
# Their titles start with "TVWCS · " so a document named "tvwcs ..." in some other app is never caught by this rule.
for_window [title="^TVWCS · .+"] floating enable, border pixel 2, move position center
