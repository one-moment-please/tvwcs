name: Release

# Beta workflow: every push to `beta` builds a prerelease you can download and test.
# Publish workflow: pushing a tag like `v2.5.0` creates the final, published release.
on:
  push:
    branches: [beta]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run unit tests
        run: ./scripts/run-tests.sh
      - name: Build zip
        id: build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./scripts/make-release.sh
            echo "file=$(ls -t resources/TVWCS-*.zip | grep -v beta | head -1)" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            ./scripts/make-release.sh --beta
            echo "file=$(ls -t resources/TVWCS-*beta*.zip | head -1)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload artifact (every beta push — always downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: tvwcs-build
          path: ${{ steps.build.outputs.file }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('beta-{0}', github.run_number) }}
          prerelease: ${{ steps.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.file }}
