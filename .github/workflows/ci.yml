name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests (no display needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install system dependencies (for import checks only)
        run: sudo apt-get update && sudo apt-get install -y gir1.2-gtk-4.0 python3-gi || true
      - name: Run unit tests
        run: ./scripts/run-tests.sh
