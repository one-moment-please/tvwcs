[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvwcs"
dynamic = ["version"]
description = "TV Window Channel Switcher - a remote-friendly, TV-style launcher and workspace switcher on sway, in GTK 4"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "TVWCS contributors" }]
keywords = ["sway", "gtk4", "launcher", "tv", "remote", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Window Managers",
]
# Runtime dependencies are system packages, not pip packages:
# install the .deb or the Arch PKGBUILD from a release; they pull in sway, swayidle, swaylock and GTK 4 for Python.

[project.scripts]
tvwcs = "tvwcs.main:main"

[project.urls]
Homepage = "https://github.com/one-moment-please/tvwcs"
Changelog = "CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "package" }

[tool.setuptools.packages.find]
where = ["package"]
include = ["tvwcs*"]

[tool.setuptools.dynamic]
version = { attr = "tvwcs.__version__" }

[tool.unittest]
start-dir = "package/tests"
